# 博客文章上传存储 API —— Cloudflare Worker
# 部署前必须设置 secrets：
#   wrangler secret put ADMIN_TOKEN   # 管理端登录密钥
#   wrangler secret put GITHUB_TOKEN  # 有 actions 写权限的 PAT，用于触发重建

name = "blog-admin-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
workers_dev = true

[vars]
GITHUB_REPO_OWNER = "ryanchiang200"
GITHUB_REPO = "ryanchiang200.github.io"
GITHUB_BRANCH = "main"
WORKFLOW_FILE = "deploy.yml"

# D1 数据库（database_id 由 `wrangler d1 create blog-db` 生成后回填）
[[d1_databases]]
binding = "DB"
database_name = "blog-db"
database_id = "REPLACE_WITH_DATABASE_ID"
migrations_dir = "migrations"
